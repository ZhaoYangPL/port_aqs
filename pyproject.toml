[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "port-aqs"
version = "0.1.0"
description = "PORT-inspired API Quota/SLO Routing synthetic research MVP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "matplotlib>=3.6",
]

[project.scripts]
port-aqs = "port_aqs.experiment:main"
port-aqs-viz = "port_aqs.visualize:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["port_aqs*"]
